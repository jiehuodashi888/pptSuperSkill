<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT review</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172f36; background: #f4f2ec; }
    body { max-width: 1100px; margin: 3rem auto; padding: 0 1.5rem; }
    header { border-bottom: 2px solid #172f36; margin-bottom: 2rem; }
    h1 { font-size: 2.6rem; margin-bottom: .4rem; } h2 { margin-top: 2rem; }
    article, .record { background: #fff; border: 1px solid #d6ddd9; padding: 1.2rem; margin: 1rem 0; border-radius: .4rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .9rem; line-height: 1.5; }
    button { border: 1px solid #1a5f53; border-radius: .3rem; padding: .6rem 1rem; background: #1a5f53; color: white; margin: .4rem .5rem .4rem 0; cursor: pointer; }
    button.secondary { background: white; color: #1a5f53; } button:disabled { opacity: .5; cursor: wait; }
    input { padding: .6rem; max-width: 90%; } #status { min-height: 1.5rem; } .error { color: #a02525; }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <header><p>ENTERPRISE PPT · LOCAL REVIEW</p><h1>Review workspace</h1><p id="company"></p></header>
  <button id="refresh" class="secondary" type="button">Refresh records</button>
  <p id="status" role="status" aria-live="polite"></p>
  <main>
    <section aria-labelledby="pending-heading"><h2 id="pending-heading">Pending candidates</h2><div id="pending"></div></section>
    <section aria-labelledby="evidence-heading"><h2 id="evidence-heading">Evidence</h2><div id="evidence" class="record"></div></section>
    <section aria-labelledby="routing-heading"><h2 id="routing-heading">Routing decisions</h2><div id="routing" class="record"></div></section>
    <section aria-labelledby="audit-heading"><h2 id="audit-heading">Audit findings</h2><div id="audit" class="record"></div></section>
  </main>
</body>
</html>
